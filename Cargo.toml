[package]
name = "esp32-opcua-gateway"
version = "0.1.0"
edition = "2021"
resolver = "2"
publish = false

# Only this crate is tied to the device. Every other member builds and runs on
# the development host (`--target host-tuple`, see README):
#
#   gateway-core       pure logic: settings/bundle parsing, value mapping,
#                      batching, diffing, backoff
#   gateway-opcua      the OPC UA client: session, subscription sync, reconnect
#                      state machine. Platform-neutral; this crate plugs it in
#   opcua-test-server  an OPC UA server on async-opcua-server (the server half
#                      of the client's own library) plus the tag catalogue
#   gateway-hil        the on-device (hardware-in-the-loop) scenario runner
#   seed-device        registers a device (MAC + secret) in the DynamoDB registry
#
# `crates/` holds vendored `[patch.crates-io]` sources and must stay out of the
# workspace.
[workspace]
members = ["gateway-core", "gateway-opcua", "opcua-test-server", "gateway-hil", "seed-device"]
exclude = ["crates"]

[[bin]]
name = "esp32-opcua-gateway"
harness = false

[dependencies]
log = "0.4"
esp-idf-svc = "0.52.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml-cfg = "0.2"
gateway-core = { path = "gateway-core" }
gateway-opcua = { path = "gateway-opcua" }

# NOT: W5500 artik ESP-IDF'in dahili esp_eth SPI surucusuyle (lwIP netif olarak)
# suruluyor; boylece TCP/IP + mbedTLS + MQTT dogrudan calisiyor. Bu yuzden
# saf-Rust register surucusu (w5500-ll) ve embedded-hal kaldirildi.

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[patch.crates-io]
signal-hook-registry = { path = "crates/signal-hook-registry" }
gethostname = { path = "crates/gethostname" }
async-opcua-types = { path = "crates/async-opcua-types" }
tokio = { path = "crates/tokio" }
