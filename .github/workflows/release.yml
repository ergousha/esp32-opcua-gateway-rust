name: Release

# Every push to main runs the platform's release pipeline
# (iot-device-sdk firmware-release.yml, pinned by commit SHA): the next semver
# from the conventional commits (feat: minor, fix: patch; nothing else
# releases), a build without secrets or AWS, a signed manifest, a GitHub
# pre-release and the upload to releases/gateway/<X.Y.Z>/. The platform's
# OTA controller then runs it on the canary, soaks it and promotes it to the
# fleet. Nothing to click; a failed release opens an issue.
#
# One-time setup (see .github/WORKFLOWS.md, Release Process): repository
# variables AWS_ROLE_ARN and AWS_FIRMWARE_BUCKET, and Environment `release`
# with FIRMWARE_SIGNING_KEY (iot-device-sdk scripts/signing-keys.sh).

on:
  push:
    branches: [ main ]

# One release at a time, never cancelled half-way (a tag without its upload
# is reported by the controller, but better not made).
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    uses: ergousha/iot-device-sdk/.github/workflows/firmware-release.yml@3c8c848859da07d509133343df247538a7eeb078 # feat/phase-3-release-pipeline
    permissions:
      contents: write # tag and GitHub pre-release
      id-token: write # AWS OIDC, publish job only
      issues: write # "release vX.Y.Z failed"
    with:
      flash-size: 16mb
      aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
      firmware-bucket: ${{ vars.AWS_FIRMWARE_BUCKET }}
      # Optional, newline-separated (the owner's SSID, say); not secrets.
      image-scan-forbidden: ${{ vars.IMAGE_SCAN_FORBIDDEN }}
