name: ESP32 Release

# Two jobs:
#
# * release-please keeps the release PR up to date and, when that PR is
#   merged, tags the release.
# * firmware builds the image for a new release and puts it in the firmware
#   bucket, whose upload event makes the OTA Lambda create an IoT job for the
#   fleet.
#
# They are separate so a failed firmware build can be re-run on its own
# ("Re-run failed jobs"): release-please only reports a release as created
# once, so a re-run of a single combined job would skip the build.
#
# The image carries secrets: the WiFi credentials, and the claim certificate
# and key from SSM. This repository is public, so the image goes only to the
# private firmware bucket — never to the GitHub Release, and never into a
# build cache that fork PRs could restore.

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      # The firmware links these crates, so a change there is a firmware change.
      - 'gateway-core/**'
      - 'gateway-opcua/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - 'sdkconfig.defaults'
      - 'partitions.csv'
      - 'certs/AmazonRootCA1.pem'
      - '.github/workflows/release.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: "2"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  ESPFLASH_VERSION: "4.5.0"
  ESPFLASH_SHA256: "9408208ee3d2408cd1247da61bf6e85e7611d4380c590b85e61070fe7e2bb069"

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write # create GitHub Releases and commit version bumps
      pull-requests: write # maintain the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56832f # v4.1.3
        id: release
        with:
          release-type: rust

  firmware:
    name: Build & deliver the firmware (OTA)
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # AWS OIDC
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Verify release configuration
        env:
          AWS_FIRMWARE_BUCKET: ${{ vars.AWS_FIRMWARE_BUCKET }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
        run: |
          if [[ -z "$AWS_ROLE_ARN" || -z "$AWS_FIRMWARE_BUCKET" ]]; then
            echo "::error::Set the AWS_ROLE_ARN and AWS_FIRMWARE_BUCKET repository variables."
            exit 1
          fi
          if [[ -z "$WIFI_SSID" ]]; then
            echo "::error::Set the WIFI_SSID and WIFI_PSK repository secrets."
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install ESP toolchain
        uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7.0
        with:
          buildtargets: esp32s3
          ldproxy: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # master
        with:
          swap-size-gb: 10

      - name: Install cargo-espflash
        run: |
          archive="$RUNNER_TEMP/cargo-espflash.zip"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/esp-rs/espflash/releases/download/v${ESPFLASH_VERSION}/cargo-espflash-x86_64-unknown-linux-gnu.zip"
          echo "${ESPFLASH_SHA256}  ${archive}" | sha256sum --check
          unzip -q "$archive" -d "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/cargo-espflash"

      # Before the build: build.rs reads the IoT endpoint, the provisioning
      # template and the claim identity from SSM with these credentials.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      # cfg.toml is gitignored; toml-cfg compiles it in. build.rs adds the
      # SSM values to it. jq renders each value as a JSON string, which is
      # also a valid TOML basic string, so quotes and backslashes survive.
      - name: Write cfg.toml
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PSK: ${{ secrets.WIFI_PSK }}
        run: |
          {
            echo '[esp32-opcua-gateway]'
            echo "wifi_ssid = $(jq -n --arg v "$WIFI_SSID" '$v')"
            echo "wifi_psk = $(jq -n --arg v "$WIFI_PSK" '$v')"
          } > cfg.toml

      - name: Build for ESP32-S3
        run: cargo build --release

      # build.rs does not fail when SSM is unreadable: it writes placeholders
      # and builds anyway, which is right for a developer checkout and wrong
      # for a release. An image without an endpoint or WiFi cannot connect,
      # so it would never mark itself valid and every device would roll back,
      # while the job still reported SUCCEEDED. Refuse to ship one. Nothing
      # here prints a value.
      - name: Verify the image's configuration
        run: |
          fail=0
          for key in wifi_ssid wifi_psk iot_endpoint provisioning_template; do
            if ! grep -Eq "^${key} = \".+\"" cfg.toml; then
              echo "::error::cfg.toml has no ${key}; the image could not connect."
              fail=1
            fi
          done
          if grep -q PLACEHOLDER certs/claim.crt.pem certs/claim.private.key; then
            echo "::error::The claim identity is a placeholder: SSM was not readable."
            fail=1
          fi
          exit "$fail"

      - name: Generate Firmware Bin
        run: >-
          cargo espflash save-image --release --chip esp32s3 --flash-size 16mb
          --partition-table partitions.csv --target-app-partition ota_0 firmware.bin

      - name: Upload Firmware to S3 (Triggers OTA)
        env:
          AWS_FIRMWARE_BUCKET: ${{ vars.AWS_FIRMWARE_BUCKET }}
        run: |
          aws s3 cp firmware.bin "s3://${AWS_FIRMWARE_BUCKET}/firmware_${TAG_NAME}.bin"
