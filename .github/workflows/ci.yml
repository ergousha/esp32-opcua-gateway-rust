name: ESP32 Build

# Two jobs:
#
# * Firmware CI — the ESP-IDF crate, for xtensa. Its checks share one runner so
#   the ESP toolchain, SDK build, swap, and Cargo cache are initialized once.
# * Host tests — every other workspace member, on stable Rust for the runner's
#   own target. This is where the OPC UA client is tested end to end: the
#   gateway-opcua suite runs the real client against a real OPC UA server
#   (opcua-test-server) over loopback, no device involved.

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: esp32-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: "2"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  ACT: false

jobs:
  firmware_ci:
    name: Firmware CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          changed_files="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[].filename')"

          # The firmware links gateway-core and gateway-opcua, so changes
          # there rebuild it too.
          while IFS= read -r path; do
            case "$path" in
              src/*|gateway-core/*|gateway-opcua/*|crates/*|Cargo.toml|Cargo.lock|build.rs|.cargo/*|rust-toolchain.toml|sdkconfig.defaults|partitions.csv|certs/AmazonRootCA1.pem)
                echo "firmware=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done <<< "$changed_files"

          echo "firmware=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: steps.filter.outputs.firmware == 'true'
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        if: steps.filter.outputs.firmware == 'true'
        with:
          components: rustfmt

      - name: Run cargo fmt
        if: steps.filter.outputs.firmware == 'true'
        run: rustup run stable cargo fmt --all -- --check

      - name: Install ESP toolchain
        if: steps.filter.outputs.firmware == 'true'
        uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7.0
        with:
          buildtargets: esp32s3
          ldproxy: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up swap space
        if: steps.filter.outputs.firmware == 'true'
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # master
        with:
          swap-size-gb: 10

      - name: Cache Rust build
        if: steps.filter.outputs.firmware == 'true' && !env.ACT
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run clippy
        if: steps.filter.outputs.firmware == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check documentation
        if: steps.filter.outputs.firmware == 'true'
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build for ESP32-S3
        if: steps.filter.outputs.firmware == 'true'
        run: cargo build --release

  host_tests:
    name: Host tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      # rust-toolchain.toml pins Espressif's fork for the firmware; the host
      # crates build on upstream stable.
      RUSTUP_TOOLCHAIN: stable
      HOST_CRATES: -p gateway-core -p gateway-opcua -p opcua-test-server -p gateway-hil -p seed-device
    steps:
      - name: Check changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          changed_files="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[].filename')"

          while IFS= read -r path; do
            case "$path" in
              gateway-core/*|gateway-opcua/*|opcua-test-server/*|gateway-hil/*|seed-device/*|crates/*|Cargo.toml|Cargo.lock|.cargo/*|.github/workflows/ci.yml)
                echo "host=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done <<< "$changed_files"

          echo "host=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: steps.filter.outputs.host == 'true'
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        if: steps.filter.outputs.host == 'true'
        with:
          components: clippy

      - name: Cache Rust build
        if: steps.filter.outputs.host == 'true' && !env.ACT
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: host

      # `--target host-tuple` overrides the xtensa default in .cargo/config.toml.
      - name: Run clippy
        if: steps.filter.outputs.host == 'true'
        run: cargo clippy $HOST_CRATES --all-targets --target host-tuple -- -D warnings

      - name: Run tests
        if: steps.filter.outputs.host == 'true'
        run: cargo test $HOST_CRATES --target host-tuple

      - name: Check documentation
        if: steps.filter.outputs.host == 'true'
        run: cargo doc $HOST_CRATES --no-deps --target host-tuple
        env:
          RUSTDOCFLAGS: -D warnings
